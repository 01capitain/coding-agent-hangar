[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-hangar"
version = "0.0.1"
description = "Local control plane for running parallel AI coding agents in tmux."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Stephan Lange" }]
keywords = ["tmux", "claude", "ai", "agents", "worktree", "dashboard"]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.5",
]

[project.scripts]
hangar-setup        = "agent_hangar.cli:init"
hangar-checkin      = "agent_hangar.cli:cockpit"
hangar-watch        = "agent_hangar.cli:dashboard"
hangar-statusline   = "agent_hangar.cli:tmux_status"
hangar-quota-update = "agent_hangar.cli:quota_update"
agent-spawn         = "agent_hangar.cli:spawn"
agent-status        = "agent_hangar.cli:status"
agent-mark-as-blocked = "agent_hangar.cli:blocked"
agent-list          = "agent_hangar.cli:list_workspaces"
agent-jump          = "agent_hangar.cli:jump"
agent-mark-done       = "agent_hangar.cli:mark_done"
agent-teardown        = "agent_hangar.cli:teardown"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_hangar = [
    "templates/*.yaml",
    "templates/*.md",
    "templates/*.tmpl",
    "templates/*.txt",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
